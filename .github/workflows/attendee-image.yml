name: Attendee Image

# Builds the attendee container image and publishes it to
# ghcr.io/jetbrains/junie-live-fake/attendee. This repo is public, so the package
# should come out publicly pullable and the cluster needs no pull secret.
#
# Temporary home: attendee itself lives in attendee-labs/attendee, which we do not
# control, and the JetBrains Space registry needs separate write credentials. This
# repo already has a GITHUB_TOKEN that can push packages, so it is the shortest path
# to an image the GKE cluster can pull.
#
# The tag format is <short-sha>-<UTC timestamp>, which is what attendee's
# BotPodCreator expects in CUBER_RELEASE_VERSION: it splits on "-" and uses the last
# segment to derive app.kubernetes.io/instance.
#
# ubuntu-latest is amd64, matching the Dockerfile's hardcoded
# `FROM --platform=linux/amd64`. Attendee's own CI builds this same Dockerfile on
# ubuntu-latest, so it fits within a hosted runner.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "attendee-labs/attendee git ref to build (branch, tag or sha)"
        required: false
        default: main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jetbrains/junie-live-fake/attendee
  SOURCE_REPO: attendee-labs/attendee

jobs:
  build:
    runs-on: ubuntu-latest
    # The image carries Chrome, ChromeDriver, the Zoom Meeting SDK and a
    # from-source build of PyAV, so a cold build is slow.
    timeout-minutes: 90
    steps:
      - name: Checkout attendee
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Compute tag
        id: tag
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "tag=${SHA}-${TS}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Free up runner disk
        # The build needs well over the ~14Gb a hosted runner leaves free by default.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-attendee-buildx-${{ hashFiles('Dockerfile', '.dockerignore', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-attendee-buildx-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=min

      - name: Rotate build cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Save build cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-attendee-buildx-${{ hashFiles('Dockerfile', '.dockerignore', 'requirements.txt') }}

      - name: Summary
        run: |
          {
            echo "### Attendee image published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| source ref | \`${{ inputs.ref }}\` (${{ steps.tag.outputs.sha }}) |"
            echo "| image | \`${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}\` |"
            echo
            echo "Deploy it with:"
            echo
            echo '```'
            echo "./deploy/k8s/deploy.sh ${{ steps.tag.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
